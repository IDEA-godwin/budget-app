<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PennyWise Nigeria - Transactions</title>
  <link rel="stylesheet" href="transactions.css" />
</head>
<body>

  <aside class="sidebar">
  <div class="brand">PennyWise</div>
  <nav>
    <a href="#">Dashboard</a>
    <a href="#" class="active">Transactions</a>
    <a href="#">Budgets</a>
    <a href="#">Savings goals</a>
    <a href="#">Reports</a>
    <a href="#">Settings</a>
  </nav>
</aside>

<div class="main">
  <h1>Transactions</h1>
  <p>Track, filter and manage all your Naira inflows and outflows</p>
  <button class="btn-primary" id="addBtn">+ Add transaction</button>
  <section class="cards">
  <div class="card">
    <span class="label">Total inflow (Oct)</span>
    <div class="big green" id="totalIn"></div>
    <small id="inCount"></small>
  </div>
  <div class="card">
    <span class="label">Total outflow (Oct)</span>
    <div class="big red" id="totalOut"></div>
    <small id="outCount"></small>
  </div>
  <div class="card">
    <span class="label">Net position</span>
    <div class="big" id="net"></div>
  </div>
</section>
<section class="panel">
  <div class="filter-top">
    <input type="search" id="search" placeholder="Search transactions by description..." />
    <div class="tabs" id="tabs">
      <button class="tab active" data-type="all">All</button>
      <button class="tab" data-type="expense">Expenses</button>
      <button class="tab" data-type="income">Income</button>
    </div>
  </div>
  <div class="filter-row">
    <label>Category
      <select id="category">
        <option value="all">All Categories</option>
        <option>Food</option>
        <option>Transport</option>
        <option>Utilities</option>
        <option>Shopping</option>
        <option>Rent</option>
        <option>Others</option>
      </select>
    </label>
    <label>Min Amount
      <input type="number" id="min" value="0" min="0" />
    </label>
    <label>Max Amount
      <input type="number" id="max" value="500000" min="0" />
    </label>
  </div>
</section>
<section class="panel table-panel">
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Description</th>
        <th>Category</th>
        <th class="right">Amount</th>
        <th class="right">Actions</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="table-foot">
    <span id="showing"></span>
    <div class="pager" id="pager"></div>
  </div>
</section>
</div>

  <script src="transactions.js"></script>
</body>
</html>
